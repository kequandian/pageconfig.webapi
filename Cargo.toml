[package]
name = "pageconfig-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.24", features = ["tokio-comp", "json"] }
mongodb = "2.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
dotenv = "0.15"
lazy_static = "1.4"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["time"] }

# Common modules from existing path
common-error-code = { path = "../eav/common-rust/common-error-code" }
common-response = { path = "../eav/common-rust/common-response" }
common-error = { path = "../eav/common-rust/common-error", features = ["database", "validation"] }
